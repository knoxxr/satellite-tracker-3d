name: Deploy OrbitPulse 3D to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Refresh shared CelesTrak CDN snapshot every 3 hours (respecting 2h CelesTrak policy)
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache shared CelesTrak CDN snapshot
        uses: actions/cache@v4
        with:
          path: public/data
          key: celestrak-snapshot-${{ github.run_id }}
          restore-keys: |
            celestrak-snapshot-

      - name: Sync shared CelesTrak active snapshot (16,900+ satellites)
        run: node scripts/sync_celestrak_snapshot.mjs

      - name: Build production bundle for GitHub Pages
        env:
          VITE_BASE_PATH: /satellite-tracker-3d/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
